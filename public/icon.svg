<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Pharmacy Cross & Heart Badge -->
  <g filter="url(#shadow)">
    <!-- White Pharmacy Cross -->
    <path d="M 216 112 L 296 112 A 16 16 0 0 1 312 128 L 312 216 L 400 216 A 16 16 0 0 1 416 232 L 416 280 A 16 16 0 0 1 400 296 L 312 296 L 312 384 A 16 16 0 0 1 296 400 L 216 400 A 16 16 0 0 1 200 384 L 200 296 L 112 296 A 16 16 0 0 1 96 280 L 96 232 A 16 16 0 0 1 112 216 L 200 216 L 200 128 A 16 16 0 0 1 216 112 Z" fill="#ffffff" />
    <!-- Inner Emerald Emblem -->
    <circle cx="256" cy="256" r="32" fill="#059669" />
    <!-- Clock checkmark inside circle -->
    <path d="M 256 236 L 256 256 L 272 264" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
